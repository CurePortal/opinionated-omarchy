# Enable the Intel iGPU by default if present.
#
# On this hybrid-graphics T2 Mac the AMD dGPU is the firmware-default display
# adapter, which forces it to stay powered on (heat, battery drain, and the
# fragile amdgpu S3 resume path). Forcing the iGPU here makes it (and, with
# `amdgpu-off.service`, its attached panel) the primary adapter.
options apple-gmux force_igd=y
