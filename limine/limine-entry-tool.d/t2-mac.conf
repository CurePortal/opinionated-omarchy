# Generated by Omarchy installer for T2 Mac support
# Updated by opinionated-omarchy: T2 S3 "deep" sleep is unreliable on
# MacBookPro16,1, so force s2idle instead.
KERNEL_CMDLINE[default]+=" intel_iommu=on iommu=pt pm_async=off pcie_ports=compat mem_sleep_default=s2idle"
# Prefer the Intel iGPU as the display adapter and load GuC/HuC (hybrid
# graphics fix; the dGPU is then disabled by amdgpu-off.service).
KERNEL_CMDLINE[default]+=" apple_gmux.force_igd=1 i915.enable_guc=3"
